[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bastionloop"
version = "0.1.0"
description = "Adversarial AI test arena with proof-carrying findings"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "cryptography>=43",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6"]

[project.scripts]
bastion = "bastion_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bastion_core*", "services*", "workers*", "bastion_cli*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
